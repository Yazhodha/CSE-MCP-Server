# fly.toml - Fly.io deployment configuration for CSE MCP Server
# Run `fly launch` to create the app and set your unique app name,
# or update the `app` field below with your chosen name.
app = 'cse-mcp-server'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.checks]
    [http_service.checks.health]
      grace_period = '10s'
      interval = '30s'
      method = 'GET'
      path = '/health'
      protocol = 'http'
      timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1